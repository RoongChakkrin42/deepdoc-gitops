# Headless Service: the StatefulSet addresses the pod as
# mongodb-0.mongodb.deepdoc.svc.cluster.local, which stays stable across
# restarts in a way a ClusterIP would not.
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: deepdoc
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: deepdoc
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongodb
          image: mongo:8
          # --wiredTigerCacheSizeGB is not optional. Left alone, WiredTiger
          # sizes its cache from the *node's* 24 GB and is promptly OOMKilled
          # against the 1Gi limit below.
          args: ["--wiredTigerCacheSizeGB", "0.5", "--bind_ip_all"]
          ports:
            - name: mongodb
              containerPort: 27017
          # These apply only to an empty data directory. Getting them wrong on
          # the first start means adding auth later requires an interactive
          # db.createUser or deleting the PVC.
          envFrom:
            - secretRef:
                name: mongodb-credentials
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            # ping is exempt from authentication, so the probe needs no
            # credentials of its own.
            exec:
              command:
                ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 8Gi
