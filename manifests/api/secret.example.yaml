# Key names only. Never commit values — this repository is public.
#
# Create the real Secrets on the cluster by hand; see the README. The
# Deployment references them by name, so nothing here changes if they are later
# replaced by SealedSecrets.
apiVersion: v1
kind: Secret
metadata:
  name: deepdoc-api-secrets
  namespace: deepdoc
stringData:
  MONGODB_URI: "mongodb://<user>:<password>@mongodb-0.mongodb.deepdoc.svc.cluster.local:27017/deepdoc?authSource=admin"
  JWT_SECRET: "<at least 16 characters — openssl rand -base64 32>"
  GEMINI_API_KEY: "<https://aistudio.google.com/apikey>"
  # These two MUST equal MINIO_ROOT_USER / MINIO_ROOT_PASSWORD below, or every
  # upload fails with SignatureDoesNotMatch.
  AWS_ACCESS_KEY_ID: "<minio root user>"
  AWS_SECRET_ACCESS_KEY: "<minio root password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: deepdoc
stringData:
  # Only applied to an empty data directory. Getting these wrong on the first
  # start means adding auth later needs an interactive db.createUser, or
  # deleting the PVC.
  MONGO_INITDB_ROOT_USERNAME: "<user>"
  MONGO_INITDB_ROOT_PASSWORD: "<password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: deepdoc
stringData:
  MINIO_ROOT_USER: "<user, at least 3 characters>"
  MINIO_ROOT_PASSWORD: "<password, at least 8 characters>"
